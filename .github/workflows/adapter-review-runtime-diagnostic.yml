name: Adapter Review Runtime Diagnostic

on:
  pull_request:
    paths: [.github/workflows/adapter-review-runtime-diagnostic.yml]

permissions:
  contents: read

jobs:
  model-inventory:
    if: github.head_ref == 'diagnose/adapter-review-runtime-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: List advertised Claude models without running inference
        shell: python
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          import json
          import os
          import urllib.error
          import urllib.request

          base = os.environ["ANTHROPIC_BASE_URL"].rstrip("/")
          key = os.environ["ANTHROPIC_API_KEY"]
          request = urllib.request.Request(base + "/v1/models", headers={
              "x-api-key": key, "authorization": "Bearer " + key,
              "anthropic-version": "2023-06-01"})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
                  models = payload.get("data", [])
                  names = sorted(model["id"] for model in models
                                 if "claude" in model.get("id", "").lower())
                  print(json.dumps({"status": response.status,
                                    "advertised_claude_models": names,
                                    "has_more": payload.get("has_more")}))
          except urllib.error.HTTPError as error:
              output = error.read().decode(errors="replace").replace(key, "[REDACTED]").replace(base, "[REDACTED]")
              print(f"Model inventory HTTP {error.code}: {output[:5000]}")
          except Exception as error:
              output = str(error).replace(key, "[REDACTED]").replace(base, "[REDACTED]")
              print(f"Model inventory {type(error).__name__}: {output}")
